name: "PlaylistDL"
version: "v2"
slug: "playlistdl"
description: "Web-based Spotify and YouTube playlist downloader"
url: "https://github.com/TannerNelson16/playlistdl"

arch:
  - amd64

startup: application
boot: auto

ports:
  5000/tcp: 4827

ports_description:
  5000/tcp: "PlaylistDL Web Interface"

webui: "http://[HOST]:[PORT:5000]"

map:
  - type: share
    read_only: false

image: "tanner23456/playlistdl"

init: false

options:
  admin_username: "admin"
  admin_password: ""
  audio_download_path: "/share/playlistdl"
  cleanup_interval: 300
  download_options: ""
  spotdl_audio_providers: "youtube"
  spotdl_extra_args: ""

schema:
  admin_username: str
  admin_password: password
  audio_download_path: str
  cleanup_interval: int
  download_options: str
  spotdl_audio_providers: str
  spotdl_extra_args: str

stage: stable